<style>
:root{font-family:'DM Sans',Arial,sans-serif;color:#232d46;background:#f7f8fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}*:focus-visible{outline:3px solid #bac6ff;outline-offset:2px}button{transition:background .15s}a{color:inherit}svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
:root{--paper:#fff;--line:#ebedf3;--ink:#1e2638;--muted:#8691a6;--blue:#5964d8;--blue-soft:#edf0ff;--green:#169c72;--green-soft:#e7f8f1;--red:#df5e62;--red-soft:#fff0f0;--shadow:0 9px 36px rgba(29,42,84,.055)}
.app-shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:30px 18px 20px;gap:29px}.brand{display:flex;align-items:center;gap:10px;font-family:Manrope,sans-serif;font-size:23px;font-weight:800;letter-spacing:-1px}.brand-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#5e68df;color:white;font-size:17px}.brand-dot{color:#6771e8}.side-caption{color:#a2abbc;font-size:10px;font-weight:800;letter-spacing:1.25px;text-transform:uppercase;margin:0 0 10px 12px}.nav-item{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;border-radius:11px;background:transparent;color:#8792a7;padding:12px;font-weight:700;font-size:13px}.nav-item.active{background:var(--blue-soft);color:#5761c7}.nav-item:not(.active):hover{background:#f7f8fc}.sidebar-bottom{margin-top:auto;border-radius:16px;border:1px solid #eef0f7;background:#f9faff;padding:16px}.household-title{font-weight:800;font-size:13px;margin-bottom:5px}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:12px}.user-avatars{display:flex;align-items:center;margin-top:14px}.avatar{display:grid;place-items:center;width:29px;height:29px;border:3px solid #fff;border-radius:50%;background:#c2b4f1;color:#5743a1;font-size:11px;font-weight:800}.avatar+.avatar{margin-left:-8px;background:#b2e7d3;color:#24765d}.avatar.empty{background:#eef1f8;color:#77829c}.invite-btn{display:block;width:100%;border:1px solid #dde1f4;background:white;border-radius:9px;padding:10px;color:#5d65c7;font-weight:800;font-size:12px;margin-top:12px}.side-footer{color:#b1b9c6;font-size:11px;padding-left:11px}

.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:27px}.summary-card{background:white;border:1px solid #eef0f6;box-shadow:var(--shadow);border-radius:16px;padding:20px;min-height:112px;position:relative;overflow:hidden}.summary-card:after{content:'';position:absolute;top:19px;right:20px;width:32px;height:32px;border-radius:11px;background:#f3f4ff}.summary-card.income:after{background:var(--green-soft)}.summary-card.expense:after{background:var(--red-soft)}.summary-card.reserve:after{background:#fff6e8}.summary-card.balance:after{background:#eaf0ff}.summary-kicker{font-weight:700;color:#8893a7;font-size:12px}.summary-value{font-family:Manrope,sans-serif;letter-spacing:-.65px;font-weight:800;font-size:23px;margin-top:18px;color:#253048;font-variant-numeric:tabular-nums;line-height:1.15}.summary-card.balance .summary-value{color:#5663cc}.summary-meta{font-size:11px;color:#9aa3b4;margin:8px 0 0}.dashboard{display:grid;grid-template-columns:minmax(435px,1fr) minmax(285px,330px);gap:20px;align-items:stretch}.surface{border:1px solid #ebedf4;background:white;border-radius:18px;box-shadow:var(--shadow)}.calendar{padding:22px 21px}.calendar-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}.calendar-heading{font-family:Manrope,sans-serif;font-size:17px;font-weight:800;letter-spacing:-.5px}.calendar-sub{font-size:11px;color:#a1aabd;margin:5px 0 0}.month-navigation{display:flex;align-items:center;gap:6px}.today-btn{background:#f4f5fa;border:0;border-radius:9px;font-size:11px;font-weight:800;color:#6b7590;padding:8px 11px;margin-right:5px}.weekday-row,.date-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday-row{margin-bottom:8px}.weekday{font-size:11px;font-weight:800;color:#adb5c4;text-align:center;padding:9px 0}.day{border:1px solid #f0f2f7;border-radius:11px;background:#fff;min-height:88px;padding:9px 8px 6px;min-width:0;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:border-color .15s,background .15s,transform .15s}.day:hover:not(.outside){border-color:#b8c0f3;background:#fafaff;transform:translateY(-1px)}.day.selected{border:1.5px solid #6672e7;background:#f3f4ff}.day.today .day-number{background:#6975e9;color:white;border-radius:8px}.day.outside{background:#fbfcfe;border-color:#f7f8fb;pointer-events:none}.day-number{font-size:12px;font-weight:800;color:#606d84;width:23px;height:23px;display:grid;place-items:center;margin-bottom:2px}.day.today:not(.selected){border-color:#dfe3fa}.day-money{font-size:11px;line-height:1.25;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:#797fc9}.day-task{width:5px;height:5px;border-radius:50%;background:#adb0e7;margin-top:auto}.calendar-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:18px;font-size:11px;color:#9aa4b6}.legend{display:flex;gap:14px}.legend span{display:flex;align-items:center;gap:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#abb0df}.dot.green{background:var(--green)}.dot.red{background:var(--red)}
.details{display:flex;flex-direction:column;min-width:0;padding:21px}.details-top{display:flex;justify-content:space-between;align-items:start;gap:10px}.details-label{color:#a1aabd;text-transform:uppercase;font-weight:800;font-size:10px;letter-spacing:1.2px}.details h2{font-family:Manrope,sans-serif;letter-spacing:-.5px;font-size:18px;line-height:1.3;margin:5px 0 3px}.details-description{color:#9ba5b7;font-size:11px}.circle-plus{height:34px;width:34px;border-radius:10px;border:0;color:#606cda;background:#edf0ff;display:grid;place-items:center}.day-overview{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px;margin-bottom:13px}.overview-card{padding:12px;border:1px solid #f0f1f5;background:#fafbfe;border-radius:11px}.overview-card .small-label{font-size:10px;color:#8e9aad}.overview-card strong{display:block;font-size:14px;margin-top:7px;font-family:Manrope,sans-serif}.separator{border-top:1px solid #edf0f5;margin:9px 0 17px}.detail-group{margin-bottom:16px}.detail-group-title{font-size:11px;font-weight:800;color:#9aa5b7;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}.entry{display:flex;align-items:center;gap:10px;width:100%;padding:10px 2px;text-align:left;border:0;background:transparent;border-bottom:1px solid #f2f3f7}.entry:hover{background:#fafbff}.entry-icon{height:32px;width:32px;border-radius:10px;display:grid;place-items:center;background:#edf0ff;color:#6370d6;flex:none}.entry-icon.income{background:var(--green-soft);color:var(--green)}.entry-icon.expense{background:var(--red-soft);color:var(--red)}.entry-icon.reserve{background:#fff5e5;color:#b98e47}.entry-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}.entry-caption{font-size:10px;color:#a3adbb;margin-top:3px}.entry-value{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.details-empty{padding:30px 10px;color:#a1abc0;text-align:center;font-size:12px;line-height:1.7}.details-bottom{margin-top:auto;padding-top:13px}.wide{width:100%}.hint{color:#a0a9bd;font-size:11px;line-height:1.5}
.modal-backdrop{position:fixed;inset:0;background:rgba(25,33,59,.38);display:grid;place-items:center;padding:20px;z-index:20;overflow:auto}.modal{background:white;border-radius:20px;padding:24px;max-width:465px;width:100%;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 22px 80px rgba(22,30,65,.25)}.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.modal h2{margin:0;font-family:Manrope,sans-serif;font-size:19px}.close-btn{border:0;background:#f2f4f9;border-radius:9px;height:32px;width:32px;color:#6c7690}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 15px}.field label{font-size:12px;font-weight:800;color:#58647d}.field input,.field select,.field textarea{width:100%;background:white;border:1px solid #e4e8f0;border-radius:10px;padding:11px 12px;font-size:13px;color:#293652}.field textarea{min-height:80px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px}.danger{color:#cf5159}.error{background:#fff0f0;color:#c9444a;font-size:12px;padding:11px;border-radius:9px;margin-bottom:12px}.success{background:#eaf8f1;color:#198561;font-size:12px;padding:11px;border-radius:9px;margin-bottom:12px}.notice{background:#f1f3ff;border:1px solid #e5e8ff;border-radius:10px;color:#666fb9;padding:11px;font-size:12px;line-height:1.5;margin-bottom:15px}.hidden{display:none!important}.loading-screen,.auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-box{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}.auth-box h1{font-family:Manrope;margin:16px 0 5px}.auth-box .brand{justify-content:center}.auth-box p{font-size:13px;color:var(--muted);line-height:1.6}.auth-box .field{margin-top:18px}.auth-box .primary-button{width:100%;margin-top:9px}.auth-box .text-button{display:block;margin:14px auto 0}.header-pill{background:#f0f2fe;color:#636cc1;border-radius:25px;padding:8px 12px;font-size:11px;font-weight:800}.logout{border:none;background:transparent;color:#929cb0;font-size:11px;font-weight:800;margin-top:10px}.status-chip{display:inline-block;border-radius:6px;background:#f1f4ff;color:#858ec7;padding:3px 6px;font-size:10px}.status-chip.done{background:#eaf8f1;color:#258e6c}.mobile-nav{display:none}
@media(max-width:1180px){.main{padding:30px 25px}.dashboard{grid-template-columns:minmax(420px,1fr) minmax(270px,310px);gap:13px}.summary-card{padding:16px}.summary-value{font-size:20px}.day{min-height:80px;padding:7px 5px}.day-money{font-size:10px}}
@media(max-width:940px){.app-shell{grid-template-columns:1fr}.sidebar{display:none}.main{max-width:800px}.dashboard{grid-template-columns:1fr}.details{min-height:280px}.summary-grid{gap:10px}.mobile-nav{display:flex;align-items:center;justify-content:space-between;background:white;padding:13px 23px;border-bottom:1px solid var(--line)}.mobile-nav .brand{font-size:19px}}
@media(max-width:590px){.main{padding:22px 12px 38px}.topline h1{font-size:23px}.topline{align-items:center}.top-description{font-size:11px}.top-actions .outline-button{display:none}.top-actions .primary-button{font-size:0;padding:10px}.top-actions .primary-button svg{font-size:initial}.summary-grid{grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}.summary-card{min-height:100px;padding:14px}.summary-value{font-size:19px;margin-top:16px}.summary-kicker{font-size:11px}.calendar{padding:14px 9px}.calendar-header{margin-bottom:11px}.calendar-heading{font-size:15px}.weekday-row,.date-grid{gap:3px}.day{min-height:71px;padding:6px 4px;border-radius:8px;gap:3px}.day-number{font-size:11px;width:19px;height:19px}.day-money{font-size:9px}.calendar-foot{font-size:9px}.legend{gap:8px}.field-row{grid-template-columns:1fr}.modal{padding:18px}.details{padding:19px}.demo-banner{font-size:11px}}
