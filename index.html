const TYPES = {
  income: { label: 'Receita', sign: 1 },
  expense: { label: 'Despesa', sign: -1 },
  reserve: { label: 'Reserva', sign: -1 },
  task: { label: 'Tarefa', sign: 0 },
};

const STATUS = {
  income: ['planned', 'received'],
  expense: ['planned', 'paid'],
  reserve: ['planned', 'set_aside'],
  task: ['pending', 'done'],
};
const STATUS_LABEL = {
  planned: 'Planejado', received: 'Recebida', paid: 'Paga',
  set_aside: 'Separado', pending: 'Pendente', done: 'Concluída',
};

function formatMoney(cents, compact = false) {
  const amount = (Number(cents) || 0) / 100;
  if (compact && Math.abs(amount) >= 10000) {
    return `${(amount / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 1})} mil`;
  }
  if (compact) return `R$ ${amount.toLocaleString('pt-BR', {maximumFractionDigits: 0})}`;
  return amount.toLocaleString('pt-BR', {style:'currency',currency:'BRL'});
}

function parseAmountToCents(raw) {
  const normalized = String(raw ?? '').trim().replace(/\s|R\$/g, '');
  if (!normalized) return 0;
  let decimal = normalized;
  if (decimal.includes(',')) decimal = decimal.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(decimal)) decimal = decimal.replace(/\./g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(decimal)) throw new Error('Informe um valor válido, com até duas casas decimais.');
  const [whole, frac=''] = decimal.split('.');
  const cents = Number(whole) * 100 + Number((frac + '00').slice(0,2));
  if (!Number.isSafeInteger(cents) || cents > 99999999999) throw new Error('Valor fora do limite permitido.');
  return cents;
}

function monthKey(dateString) { return String(dateString).slice(0,7); }
function pad2(n) { return String(n).padStart(2, '0'); }
function dayKey(year, monthOneIndexed, day) { return `${year}-${pad2(monthOneIndexed)}-${pad2(day)}`; }
function daysInMonth(year, monthOneIndexed) { return new Date(year, monthOneIndexed, 0).getDate(); }
function addMonth(isoMonth, delta) {
  const [year, month] = isoMonth.split('-').map(Number);
  const d = new Date(year, month - 1 + delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}
function formatMonth(isoMonth) {
  const [year, month] = isoMonth.split('-').map(Number);
  const result = new Intl.DateTimeFormat('pt-BR', {month:'long', year:'numeric'}).format(new Date(year, month-1, 1));
  return result.charAt(0).toUpperCase() + result.slice(1);
}
function monthlyOccurrenceDate(entry, isoMonth) {
  if (entry.frequency !== 'monthly') return entry.entry_date.startsWith(isoMonth) ? entry.entry_date : null;
  if (entry.entry_date.slice(0,7) > isoMonth) return null;
  const [y,m] = isoMonth.split('-').map(Number);
  const originalDay = Number(entry.entry_date.slice(8,10));
  return dayKey(y, m, Math.min(originalDay, daysInMonth(y,m)));
}

function expandMonth(entries, overrides, isoMonth) {
  const overridesByKey = new Map(overrides.map(o => [`${o.entry_id}|${o.occurrence_date}`, o]));
  const output=[];
  for (const entry of entries) {
    const occurrenceDate = monthlyOccurrenceDate(entry, isoMonth);
    if (!occurrenceDate) continue;
    const o = overridesByKey.get(`${entry.id}|${occurrenceDate}`);
    if (o?.deleted) continue;
    output.push({
      ...entry,
      title: o?.title ?? entry.title,
      amount_cents: o?.amount_cents ?? entry.amount_cents,
      category: o?.category ?? entry.category,
      notes: o?.notes ?? entry.notes,
      status: o?.status ?? entry.status,
      occurrence_date: occurrenceDate,
      occurrence_id: `${entry.id}|${occurrenceDate}`,
      is_recurring: entry.frequency === 'monthly',
    });
  }
  return output.sort((a,b)=>a.occurrence_date.localeCompare(b.occurrence_date) || a.title.localeCompare(b.title));
}

function summarize(entries) {
  const result = {income:0, expense:0, reserve:0, paid:0, received:0, set_aside:0, pending:0, tasks:0, balance:0, realized:0};
  for (const e of entries) {
    const n = Number(e.amount_cents) || 0;
    if (e.entry_type === 'income') { result.income += n; if (e.status==='received') result.received+=n; }
    if (e.entry_type === 'expense') { result.expense += n; if (e.status==='paid') result.paid+=n; else result.pending+=n; }
    if (e.entry_type === 'reserve') { result.reserve += n; if (e.status==='set_aside') result.set_aside+=n; }
    if (e.entry_type === 'task') result.tasks++;
  }
  result.balance = result.income-result.expense-result.reserve;
  result.realized = result.received-result.paid-result.set_aside;
  return result;
}

function toInputMoney(cents) { return ((Number(cents)||0)/100).toFixed(2).replace('.',','); }

const esc = (text) => String(text ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id = () => crypto.randomUUID();
const friendlyDate = (date) => { const [y,m,d] = date.split('-').map(Number); return new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(new Date(y,m-1,d)); };
const short = (cents) => { const v = Math.round(cents/100); return v>=10000 ? `R$ ${(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})}k` : `R$ ${v.toLocaleString('pt-BR')}`; };
function loadDemo() {
  let data = null;
  try {
    // Apaga registros do MVP anterior uma única vez, sem afetar lançamentos futuros.
    const legacyExisted = localStorage.getItem(LEGACY_DEMO_KEY) !== null;
    localStorage.removeItem(LEGACY_DEMO_KEY);
    if (legacyExisted) state.notice = 'Dados de teste removidos deste navegador. Calendário pronto para novos cadastros.';
    data = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null');
  } catch { data = null; }
  if (!data || !Array.isArray(data.entries)) data = {entries:[],overrides:[]};
  state.entries=data.entries;
  state.overrides=Array.isArray(data.overrides) ? data.overrides : [];
  state.household={id:'demo',name:'Meu calendário',created_by:'demo'};
  state.members=[{user_id:'demo',role:'owner'}]; saveDemo();
}
function saveDemo() { if(state.mode==='demo') localStorage.setItem(DEMO_KEY,JSON.stringify({entries:state.entries,overrides:state.overrides})); }

async function initialize() {
  const cfg=window.APP_CONFIG||{};
  if(cfg.SUPABASE_URL && cfg.SUPABASE_PUBLISHABLE_KEY) {
    try {
      const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.76.1');
      state.supabase=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      state.mode='online';
      const {data:{session},error}=await state.supabase.auth.getSession(); if(error) throw error;
      state.session=session;
      if(session) await loadRemote();
      state.supabase.auth.onAuthStateChange((_event,session)=>{if(session?.user?.id!==state.session?.user?.id){state.session=session;setTimeout(async()=>{if(session) await loadRemote(); else{state.household=null;state.entries=[];state.overrides=[];}render();},0);}});
      setInterval(async()=>{if(document.visibilityState==='visible' && state.session && !state.working) await loadRemote(true);},20000);
    } catch (error) {
      root.innerHTML=`<div class="loading-screen"><div class="auth-box"><h1>Configuração indisponível</h1><p>${esc(error.message)}</p><p>Verifique a URL e a chave pública do seu projeto Supabase em <code>config.js</code>.</p></div></div>`;
      return;
    }
  } else loadDemo();
  render();
}
async function loadRemote(silent=false) {
  const db=state.supabase;
  if(!state.session) return;
  if(state.inviteToken) {
    const {error}=await db.rpc('accept_household_invite',{_token:state.inviteToken});
    state.notice=error?`Não foi possível aceitar o convite: ${error.message}`:'Convite aceito. Agora vocês compartilham o mesmo calendário.';
    state.inviteToken=null;
    history.replaceState(null,'',location.pathname);
  }
  let {data:house,error:houseError}=await db.from('households').select('id,name,created_by').limit(1).maybeSingle();
  if(houseError) { if(!silent) state.error=houseError.message; return; }
  if(!house) {
    const {data:newId,error}=await db.rpc('create_household',{_name:'Nosso planejamento'});
    if(error){state.error=error.message;return;}
    const res=await db.from('households').select('id,name,created_by').eq('id',newId).single();
    if(res.error){state.error=res.error.message;return;}
    house=res.data;
  }
  state.household=house;
  const [e,o,m]=await Promise.all([
    db.from('entries').select('*').eq('household_id',house.id).order('entry_date'),
    db.from('entry_overrides').select('*,entries!inner(household_id)').eq('entries.household_id',house.id),
    db.from('household_members').select('household_id,user_id,role').eq('household_id',house.id),
  ]);
  const error=e.error||o.error||m.error;
  if(error){state.error=error.message;return;}
  state.entries=e.data||[]; state.overrides=o.data||[]; state.members=m.data||[];
  if(!silent) state.error='';
  render();
}

function summaryCard(kind,label,value,meta){return `<article class="summary-card ${kind}"><div class="summary-kicker">${label}</div><div class="summary-value">${formatMoney(value)}</div><div class="summary-meta">${meta}</div></article>`;}
function renderCalendar(rows) {
  const [year,month]=state.month.split('-').map(Number);
  const first=new Date(year,month-1,1).getDay();
  const count=daysInMonth(year,month);
  const cells=Math.ceil((first+count)/7)*7;
  const content=Array.from({length:cells},(_,index)=>{
    const day=index-first+1;
    if(day<1||day>count) return '<div class="day outside" aria-hidden="true"></div>';
    const date=dayKey(year,month,day);const dayRows=rows.filter(e=>e.occurrence_date===date);
    const s=summarize(dayRows);
    return `<button type="button" class="day ${state.selected===date?'selected':''} ${date===today?'today':''}" data-action="select-day" data-date="${date}" aria-label="${day} de ${formatMonth(state.month)}. ${dayRows.length} lançamentos">
      <span class="day-number">${day}</span>${s.income?`<span class="day-money positive">+ ${short(s.income)}</span>`:''}
      ${s.expense?`<span class="day-money negative">− ${short(s.expense)}</span>`:''}
      ${s.reserve?`<span class="day-money neutral">◉ ${short(s.reserve)}</span>`:''}
      ${s.tasks?`<span class="day-task" title="${s.tasks} tarefa(s)"></span>`:''}</button>`;
  }).join('');
  return `<article class="surface calendar"><div class="calendar-header"><div><div class="calendar-heading">${formatMonth(state.month)}</div><div class="calendar-sub">Clique em um dia para ver os detalhes</div></div>
  <div class="month-navigation"><button class="today-btn" data-action="today">Hoje</button><button class="icon-button" data-action="previous" aria-label="Mês anterior">${svg('left')}</button><button class="icon-button" data-action="next" aria-label="Mês seguinte">${svg('right')}</button></div></div>
  <div class="weekday-row">${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(w=>`<span class="weekday">${w}</span>`).join('')}</div>
  <div class="date-grid">${content}</div><div class="calendar-foot"><div class="legend"><span><i class="dot green"></i> Entradas</span><span><i class="dot red"></i> Saídas</span><span><i class="dot"></i> Tarefas</span></div><span>${rows.length} lançamentos</span></div></article>`;
}

  <div class="details-bottom"><button type="button" class="outline-button wide" data-action="new">${svg('plus')} Adicionar ao dia</button></div></aside>`;

function bindAuth() {
  root.querySelector('[data-action="switch-auth"]')?.addEventListener('click',()=>{state.authMode=state.authMode==='login'?'register':'login';state.error='';state.notice='';render();});
  root.querySelector('#auth-form')?.addEventListener('submit',async(event)=>{
    event.preventDefault(); const form=new FormData(event.target);const email=String(form.get('email')).trim();const password=String(form.get('password'));
    state.error='';state.notice='';
    const result=state.authMode==='login'?await state.supabase.auth.signInWithPassword({email,password}):await state.supabase.auth.signUp({email,password});
    if(result.error)state.error=result.error.message;
    else if(state.authMode==='register'&&!result.data.session) state.notice='Conta criada. Confira seu e-mail para confirmar o cadastro antes de entrar.';
    else {state.session=result.data.session;await loadRemote();}
    render();
  });
}
function changeMonth(delta) {
  state.month=addMonth(state.month,delta);
  const [year,month]=state.month.split('-').map(Number);
  const oldDay=Number(state.selected.slice(8,10));
  state.selected=dayKey(year,month,Math.min(oldDay,daysInMonth(year,month)));
  state.notice='';render();
}
function bindActions(){
  root.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',async(event)=>{
    const action=btn.dataset.action;
    if(action==='previous')return changeMonth(-1);
    if(action==='next')return changeMonth(1);
    if(action==='today'){state.month=initialMonth;state.selected=today;state.notice='';return render();}
    if(action==='select-day'){state.selected=btn.dataset.date;state.notice='';return render();}
    if(action==='new'){state.modal={kind:'entry',date:state.selected};return render();}
    if(action==='edit'){const entry=entriesForMonth().find(e=>e.id===btn.dataset.id&&e.occurrence_date===btn.dataset.date);state.modal={kind:'entry',entry};return render();}
    if(action==='close'){state.modal=null;return render();}
    if(action==='invite'){state.modal={kind:'invite'};return render();}
    if(action==='generate-invite')return generateInvite();
    if(action==='copy-invite'){
      try{await navigator.clipboard.writeText(state.modal.link);state.notice='Link copiado.';state.modal=null;render();}catch{window.prompt('Copie o link:',state.modal.link);}
      return;
    }
    if(action==='delete-entry')return deleteEntry();
    if(action==='refresh')return await loadRemote();
    if(action==='logout'){await state.supabase.auth.signOut();state.session=null;state.entries=[];state.overrides=[];state.household=null;return render();}
  }));
  root.querySelector('.modal-backdrop')?.addEventListener('click',e=>{if(e.target===e.currentTarget){state.modal=null;render();}});
  root.querySelector('#entry-form')?.addEventListener('submit',saveEntry);
  root.querySelector('#entry-type')?.addEventListener('change',e=>{
    const selected=e.target.value;
    const status=root.querySelector('#entry-status');
    if(status){const old=status.value;status.innerHTML=STATUS[selected].map(s=>`<option value="${s}">${STATUS_LABEL[s]}</option>`).join('');if(STATUS[selected].includes(old))status.value=old;}
    const amount=root.querySelector('#amount-field');if(amount)amount.classList.toggle('hidden',selected==='task');
  });
  const entryType=root.querySelector('#entry-type');if(entryType)entryType.dispatchEvent(new Event('change'));
}
function validateDate(value) {const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');if(!m)return false;const [y,mo,d]=m.slice(1).map(Number);return mo>=1&&mo<=12&&d>=1&&d<=daysInMonth(y,mo);}
async function persistInsert(table,obj) {
  if(state.mode==='demo'){
    if(table==='entries')state.entries.push(obj); else if(table==='entry_overrides'){
      const index=state.overrides.findIndex(o=>o.entry_id===obj.entry_id&&o.occurrence_date===obj.occurrence_date);
      if(index<0)state.overrides.push(obj);else state.overrides[index]={...state.overrides[index],...obj};
    }
    saveDemo();return;
  }
  const query=table==='entry_overrides'?state.supabase.from(table).upsert(obj,{onConflict:'entry_id,occurrence_date'}):state.supabase.from(table).insert(obj);
  const {error}=await query;if(error)throw error;
}
async function persistUpdate(table,id,values) {
  if(state.mode==='demo'){const index=state.entries.findIndex(e=>e.id===id);if(index>=0)state.entries[index]={...state.entries[index],...values};saveDemo();return;}
  const {error}=await state.supabase.from(table).update(values).eq('id',id);if(error)throw error;
}
async function persistDelete(id) {
  if(state.mode==='demo'){state.entries=state.entries.filter(e=>e.id!==id);state.overrides=state.overrides.filter(o=>o.entry_id!==id);saveDemo();return;}
  const {error}=await state.supabase.from('entries').delete().eq('id',id);if(error)throw error;
}
async function reloadAfterWrite() {if(state.mode==='online')await loadRemote(true);else render();}
async function saveEntry(event) {
  event.preventDefault();if(state.working)return;
  const form=new FormData(event.currentTarget);const original=state.modal.entry||null;
  const type=original?.entry_type||String(form.get('entry_type'));
  const entryDate=original?.is_recurring?original.entry_date:String(form.get('entry_date'));
  const occurrenceDate=original?.occurrence_date||entryDate;
  try {
    if(!validateDate(entryDate))throw new Error('Selecione uma data válida.');
    const title=String(form.get('title')||'').trim();if(!title||title.length>100)throw new Error('Título obrigatório (até 100 caracteres).');
    const amount=type==='task'?0:parseAmountToCents(form.get('amount'));
    const status=String(form.get('status'));
    if(!STATUS[type]?.includes(status))throw new Error('Status incompatível com o tipo.');
    const values={title,entry_type:type,amount_cents:amount,status,category:String(form.get('category')||'Outros'),notes:String(form.get('notes')||''),entry_date:entryDate};
    state.working=true;
    if(!original){await persistInsert('entries',{id:id(),household_id:state.household.id,created_by:state.mode==='online'?state.session.user.id:null,...values,frequency:form.get('monthly')?'monthly':'none'});}
    else if(original.is_recurring && form.get('scope')!=='series'){
      await persistInsert('entry_overrides',{entry_id:original.id,occurrence_date:occurrenceDate,title,amount_cents:amount,category:values.category,notes:values.notes,status,deleted:false});
    }else {await persistUpdate('entries',original.id,{...values,frequency:original.is_recurring?'monthly':form.get('monthly')?'monthly':'none'});}
    state.modal=null;state.error='';state.notice='Lançamento salvo com sucesso.';state.month=monthKey(occurrenceDate);state.selected=occurrenceDate;
    await reloadAfterWrite();
  }catch(error){state.modal.error=error.message;render();}finally{state.working=false;}
}
async function deleteEntry() {
  const original=state.modal?.entry;if(!original||state.working)return;
  const scope=root.querySelector('#edit-scope')?.value;
  const isOccurrence=original.is_recurring&&scope!=='series';
  const question=isOccurrence?'Excluir somente esta ocorrência?':'Excluir este lançamento'+(original.is_recurring?' e toda a série mensal':'')+'?';
  if(!confirm(question))return;
  try{
    state.working=true;
    if(isOccurrence)await persistInsert('entry_overrides',{entry_id:original.id,occurrence_date:original.occurrence_date,deleted:true});
    else await persistDelete(original.id);
    state.modal=null;state.notice='Lançamento excluído.';await reloadAfterWrite();
  }catch(error){state.modal.error=error.message;render();}finally{state.working=false;}
}
async function generateInvite() {
  if(state.mode!=='online'||state.members.length>=2)return;
  const {data,error}=await state.supabase.rpc('create_household_invite',{_household_id:state.household.id});
  if(error){state.modal.error=error.message;return render();}
  const url=new URL(location.origin+location.pathname);url.searchParams.set('convite',String(data));
  state.modal.link=url.toString();render();
}
initialize();

</script>
